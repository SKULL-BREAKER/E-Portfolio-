  <!-- MAIN CONTENT: DEDICATED CONTACT PAGE -->
  <main class="page-main">
    <div class="container">
      <div class="page-header-block">
        <h1 class="page-main-title">GET IN TOUCH</h1>
      </div>

      <div class="contact-grid">
        <!-- Hardened Interactive Form (Left Column) -->
        <div class="contact-card">
          <div id="formAlert" class="form-alert"></div>

          <form id="contactForm" class="contact-form" novalidate>
            <!-- Anti-Spam Honeypot Field -->
            <input type="text" name="hp_website" id="hp_website" class="hp-field" tabindex="-1" autocomplete="off">

            <div class="form-group">
              <label for="contactName" class="form-label">FULL NAME</label>
              <input type="text" id="contactName" name="name" class="form-input" required maxlength="100" placeholder="e.g., Alex Morgan">
            </div>

            <div class="form-group">
              <label for="contactEmail" class="form-label">EMAIL ADDRESS</label>
              <input type="email" id="contactEmail" name="email" class="form-input" required maxlength="120" placeholder="name@organization.com">
            </div>

            <div class="form-group">
              <label for="contactSubject" class="form-label">SUBJECT</label>
              <input type="text" id="contactSubject" name="subject" class="form-input" maxlength="150" placeholder="e.g., Frontend Architecture Consultation / Engineering Collaboration">
            </div>

            <div class="form-group">
              <label for="contactMessage" class="form-label">INQUIRY MESSAGE</label>
              <textarea id="contactMessage" name="message" class="form-textarea" required maxlength="3000" placeholder="Detail your engineering requirements, technical consultation inquiries, or prospective collaboration scope..."></textarea>
            </div>

            <button type="submit" class="btn-white-solid" id="submitContactBtn" style="justify-content: center; width: 100%;">
              <span>SEND SECURE MESSAGE</span>
            </button>
          </form>
        </div>

        <!-- Direct Channels Card (Right Column) -->
        <div class="contact-card">
          <div class="contact-list">
            <div class="contact-row-item">
              <span class="label">PRIMARY EMAIL</span>
              <a href="mailto:nanthakumar7750@gmail.com" class="dynamic-email">
                nanthakumar7750@gmail.com
              </a>
            </div>

            <div class="contact-row-item">
              <span class="label">LOCATION</span>
              <span id="dynamicLocationDisplay">
                Tamil Nadu, India
              </span>
            </div>

            <div class="contact-row-item">
              <span class="label">PROFILES &amp; SOCIAL</span>
              <div class="contact-social-icons">
                <a href="https://github.com/nanthakumar" target="_blank" rel="noopener noreferrer" class="social-icon-btn github-icon-btn" id="dynamicGithub" title="Visit GitHub Account (nanthakumar)" aria-label="GitHub Profile">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                  </svg>
                  <span class="social-btn-label">GitHub</span>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="social-btn-arrow-svg"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
                </a>

                <a href="https://linkedin.com/in/nanthakumar" target="_blank" rel="noopener noreferrer" class="social-icon-btn linkedin-icon-btn" id="dynamicLinkedin" title="Visit LinkedIn Account (nanthakumar)" aria-label="LinkedIn Profile">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
                  </svg>
                  <span class="social-btn-label">LinkedIn</span>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="social-btn-arrow-svg"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
