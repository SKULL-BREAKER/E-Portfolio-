<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="nGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="nAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Bespoke Obsidian Solid Base -->
  <rect width="64" height="64" fill="#030816" stroke="#1e293b" stroke-width="2" />
  
  <!-- Outer Geometric Accent Corner Flairs -->
  <polygon points="4,4 12,4 4,12" fill="#f97316" />
  <polygon points="60,60 52,60 60,52" fill="#38bdf8" />

  <!-- Bespoke Architectural N Monogram -->
  <!-- Left Vertical Stem -->
  <polygon points="15,14 23,14 23,50 15,50" fill="url(#nGrad)" />
  <!-- Diagonal Traverse -->
  <polygon points="21,14 30,14 49,46 49,50 40,50 19,16" fill="url(#nGrad)" />
  <!-- Right Vertical Stem -->
  <polygon points="41,14 49,14 49,50 41,50" fill="#ffffff" opacity="0.95" />

  <!-- Micro Geometric Identity Nodes -->
  <circle cx="19" cy="14" r="2.5" fill="#38bdf8" />
  <circle cx="45" cy="50" r="2.5" fill="#f97316" />
</svg>
