      <a href="./index.html" class="brand-identity">
        <div class="brand-icon">
          <img src="./assets/brand-logo.jpg" alt="NANTHA Logo" class="brand-logo-img">
        </div>
        <span class="brand-name">NANTHA</span>

      <nav class="main-navigation" id="mainNav">
        <ul class="nav-list">
          <li><a href="./index.html" class="nav-link active">HOME</a></li>
          <li><a href="./about.html" class="nav-link">ABOUT</a></li>
          <li><a href="./skills.html" class="nav-link">SKILLS</a></li>

  <main>

      <div class="container">
        <div class="hero-split-layout">
          <!-- Left Column: Professional Male Portrait -->

          </div>

              <span class="hero-greeting-prefix">Hello, I'm</span>
              <h1 class="hero-display-name dynamic-name">NANTHAKUMAR T</h1>
            </div>
            <div class="hero-tagline-text" id="heroRoleCycler" role="status" aria-live="polite" title="Click to cycle roles">
              <span class="role-terminal-prompt" aria-hidden="true">&gt;</span>
              <span class="role-typing-text" id="roleTypingText">B.TECH AI &amp; DATA SCIENCE</span>
              <span class="role-blinking-cursor" aria-hidden="true">_</span>
            </div>

            <!-- Actions Row: CTA Buttons + Inline Social Links -->
            <div class="hero-action-row">
              <a href="./projects.html" class="btn-white-solid">
                <span>EXPLORE PROJECTS</span>

              <!-- Inline Social Links Beside CTA Button -->
              <div class="hero-inline-socials">
                <a href="https://github.com/nanthakumar" target="_blank" rel="noopener noreferrer" class="social-icon-btn-icon-only github-icon-btn dynamic-github" title="Visit GitHub (@nanthakumar)" aria-label="GitHub Profile">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                  </svg>
                </a>
                <a href="https://linkedin.com/in/nanthakumar" target="_blank" rel="noopener noreferrer" class="social-icon-btn-icon-only linkedin-icon-btn dynamic-linkedin" title="Visit LinkedIn (nanthakumar)" aria-label="LinkedIn Profile">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>

            <div class="hero-qr-container">

                <span class="hero-qr-label">PORTFOLIO QR CODE</span>
                <div class="hero-qr-actions">
                  <button class="btn-qr-action" id="copyPortfolioUrlBtn">COPY LINK</button>
                  <button class="btn-qr-action" id="downloadQrBtn">SAVE QR</button>

              </div>

          </div>

        &copy; 2026 NANTHAKUMAR T.
